{% extends "base.html" %}
{% block title %}Review{% endblock %}

{% block content %}
  <a class="back" href="/decks/{{ deck['id'] }}">← {{ deck["name"] }}</a>

  <div class="face">{{ card["front"] }}</div>

  <div id="answer" style="display:none">
    <div class="face rear">{{ card["back"] }}</div>
    <form class="rate" id="rateForm" method="POST" action="/cards/{{ card['id'] }}/rate">
      <button class="r1" name="rating" value="1">Again <small>1</small></button>
      <button class="r2" name="rating" value="2">Hard <small>2</small></button>
      <button class="r3" name="rating" value="3">Good <small>3</small></button>
      <button class="r4" name="rating" value="4">Easy <small>4</small></button>
    </form>
  </div>

  <button id="show" class="wide">Show answer <small style="opacity:.6">space</small></button>

  <script>
    const show = document.getElementById('show');
    const answer = document.getElementById('answer');

    function reveal() {
      answer.style.display = 'block';
      show.style.display = 'none';
    }

    show.addEventListener('click', reveal);

    document.addEventListener('keydown', (e) => {
      if (e.code === 'Space' && answer.style.display === 'none') {
        e.preventDefault();
        reveal();
        return;
      }
      if (answer.style.display === 'block' && ['1','2','3','4'].includes(e.key)) {
        document.querySelector(`#rateForm .r${e.key}`).click();
      }
    });
  </script>
{% endblock %}
