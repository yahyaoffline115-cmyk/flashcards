<!DOCTYPE html>
<html>
<head><title>Review</title></head>
<body>
  <a href="/decks/{{ deck['id'] }}">← Back</a>
  <h1>{{ deck["name"] }}</h1>

  <h2>{{ card["front"] }}</h2>

  <div id="answer" style="display: none;">
    <h3>{{ card["back"] }}</h3>
    <form method="POST" action="/cards/{{ card['id'] }}/rate">
      <button name="rating" value="1">Again</button>
      <button name="rating" value="2">Hard</button>
      <button name="rating" value="3">Good</button>
      <button name="rating" value="4">Easy</button>
    </form>
  </div>

  <button id="show" onclick="document.getElementById('answer').style.display='block'; this.style.display='none';">
    Show answer
  </button>
</body>
</html>
