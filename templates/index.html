<!DOCTYPE html>
<html>
<head><title>Flashcards</title></head>
<body>
  <h1>My Decks</h1>

  <form method="POST" action="/decks/new">
    <input name="name" placeholder="Deck name">
    <button type="submit">Create</button>
  </form>

  <ul>
    {% for deck in decks %}
      <li><a href="/decks/{{ deck['id'] }}">{{ deck["name"] }}</a></li>
    {% endfor %}
  </ul>
</body>
</html>
