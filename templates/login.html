{% extends "base.html" %}
{% block title %}Log in{% endblock %}

{% block content %}
  <h1>Log in</h1>

  {% with messages = get_flashed_messages() %}
    {% if messages %}
      {% for m in messages %}<p class="empty">{{ m }}</p>{% endfor %}
    {% endif %}
  {% endwith %}

  <form method="POST" action="/login">
    <div class="row"><input type="text" name="email" placeholder="Email"></div>
    <div class="row"><input type="password" name="password" placeholder="Password"></div>
    <button class="wide" type="submit">Log in</button>
  </form>

  <p class="count" style="margin-top:20px">
    No account? <a href="/signup">Sign up</a>
  </p>
{% endblock %}
